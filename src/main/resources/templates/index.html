<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema NF Web</title>
    <link rel="stylesheet" th:href="@{/css/sistema.css}">
</head>
<body>
<main class="login-page">
    <section class="login-card">
        <div class="login-brand"><div class="brand-mark">NF</div><div><div class="brand-name">Sistema NF 2.0</div><span class="brand-subtitle">Gestão acadêmica</span></div></div>
        <h1>Notas e Faltas</h1>
        <p class="subtitle">Aplicação Web conectada ao MySQL.</p>
        <div class="card">
            <h2>Informações do sistema</h2>
            <p>Total de alunos cadastrados: <strong th:text="${totalAlunos}">0</strong></p>
            <p>Desenvolvido com Java 21, Spring Boot e Thymeleaf.</p>
        </div>
        <form th:action="@{/logout}" method="post"><button type="submit" style="width:100%">Sair do sistema</button></form>
    </section>
</main>
</body>
</html>
